<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Order - Bakso Bakar Jumbo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Sembunyikan scrollbar untuk menu kategori */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @media print {
            body * { visibility: hidden; }
            #qr-result-container, #qr-result-container * { visibility: visible; }
            #qr-result-container { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); width: 300px; border: none !important; background: transparent !important; }
            #btn-print-qr { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 font-sans antialiased min-h-screen pb-24">

    <!-- HEADER ALA APLIKASI -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center bg-white">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-rose-600 text-white flex items-center justify-center font-bold text-lg shadow-md">
                    B
                </div>
                <div>
                    <h1 class="font-black text-slate-900 text-sm tracking-wide">BAKSO BAKAR JUMBO</h1>
                    <div class="flex items-center text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full w-fit mt-0.5">
                        <i class="fa-solid fa-location-dot mr-1"></i> <span id="display-meja">Scan Meja</span>
                    </div>
                </div>
            </div>
            <button onclick="switchView('admin')" id="btn-admin-toggle" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200 transition">
                <i class="fa-solid fa-gear text-xs"></i>
            </button>
        </div>
        
        <!-- Kategori Horizontal Scroll (Vibes Gacoan) -->
        <div id="kategori-bar" class="max-w-md mx-auto px-4 py-2 bg-white border-t border-gray-100 flex space-x-2 overflow-x-auto no-scrollbar">
            <button class="px-4 py-1.5 bg-rose-600 text-white text-xs font-bold rounded-full whitespace-nowrap shadow-sm">🔥 Bakso Bakar</button>
            <button class="px-4 py-1.5 bg-gray-100 text-slate-500 text-xs font-bold rounded-full whitespace-nowrap hover:bg-gray-200">🥤 Minuman</button>
            <button class="px-4 py-1.5 bg-gray-100 text-slate-500 text-xs font-bold rounded-full whitespace-nowrap hover:bg-gray-200">🍟 Cemilan Tambahan</button>
        </div>
    </header>

    <!-- ================= 1. VIEW PELANGGAN ================= -->
    <main id="view-customer" class="max-w-md mx-auto p-4">
        
        <!-- Grid Menu ala GoFood/Gacoan (2 Kolom) -->
        <div id="customer-menu-grid" class="grid grid-cols-2 gap-3">
            <!-- Render Menu via JS -->
        </div>

        <!-- Floating Cart Bar Bawah -->
        <div id="cart-bar" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white p-3.5 rounded-2xl shadow-2xl hidden flex justify-between items-center z-40">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-rose-600 rounded-full flex items-center justify-center font-bold relative">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-white text-rose-600 text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center border border-slate-900">0</span>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 font-medium">Total Harga</p>
                    <p class="font-bold text-base" id="cart-total-price">Rp 0</p>
                </div>
            </div>
            <button onclick="openCheckoutModal()" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs shadow-md transition">
                Checkout <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
            </button>
        </div>
    </main>

    <!-- ================= 2. VIEW ADMIN (DASHBOARD POS) ================= -->
    <main id="view-admin" class="max-w-5xl mx-auto p-4 hidden">
        <div class="flex justify-between items-center mb-5">
            <h2 class="font-black text-xl text-slate-900">Dashboard Admin</h2>
            <button onclick="switchView('customer')" class="text-xs bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-bold">Kembali ke Menu</button>
        </div>

        <!-- Tab Navigasi Admin -->
        <div class="flex space-x-2 mb-4 bg-white p-1 rounded-xl border border-gray-200 w-fit overflow-x-auto shadow-sm">
            <button onclick="switchAdminTab('orders')" id="tab-orders" class="px-4 py-2 text-xs rounded-lg font-bold bg-slate-900 text-white transition whitespace-nowrap">Dapur & Pesanan</button>
            <button onclick="switchAdminTab('menus')" id="tab-menus" class="px-4 py-2 text-xs rounded-lg font-bold text-slate-500 hover:text-slate-900 transition whitespace-nowrap">Kelola Menu</button>
            <button onclick="switchAdminTab('qr')" id="tab-qr" class="px-4 py-2 text-xs rounded-lg font-bold text-slate-500 hover:text-slate-900 transition whitespace-nowrap">Cetak QR Meja</button>
        </div>

        <div id="admin-orders-section" class="space-y-3">
            <div id="admin-order-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
        </div>

        <div id="admin-menus-section" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                <h3 class="font-bold text-slate-900 text-sm mb-3">Tambah Menu Baru</h3>
                <form id="form-add-menu" onsubmit="tambahMenuBaru(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <input type="text" id="menu-nama" placeholder="Nama Menu (Cth: Bakso Level 5)" required class="border border-gray-300 bg-gray-50 p-2.5 rounded-xl text-xs font-medium">
                    <input type="number" id="menu-harga" placeholder="Harga (Cth: 15000)" required class="border border-gray-300 bg-gray-50 p-2.5 rounded-xl text-xs font-medium">
                    <input type="url" id="menu-gambar" placeholder="Link Gambar (Opsional)" class="border border-gray-300 bg-gray-50 p-2.5 rounded-xl text-xs font-medium">
                    <button type="submit" class="bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-slate-800 transition shadow-md">Simpan Menu</button>
                </form>
            </div>
            <div id="admin-menu-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3"></div>
        </div>

        <div id="admin-qr-section" class="hidden">
            <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm max-w-sm mx-auto text-center">
                <h3 class="font-bold text-slate-900 mb-2">Buat QR Code Meja</h3>
                <input type="text" id="input-no-meja" placeholder="Nomor Meja (Cth: 01)" class="w-full border border-gray-300 bg-gray-50 p-3 rounded-xl text-center font-bold mb-3">
                <button onclick="buatQR()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl mb-4">Generate QR</button>
                <div id="qr-result-container" class="hidden flex-col items-center">
                    <h1 id="qr-meja-title" class="text-3xl font-black mb-3 uppercase">Meja --</h1>
                    <div id="qrcode-box" class="p-3 bg-white rounded-xl shadow-md border mb-4"></div>
                    <button id="btn-print-qr" onclick="window.print()" class="w-full bg-rose-600 text-white font-bold py-2 rounded-xl"><i class="fa-solid fa-print"></i> Cetak QR</button>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL CHECKOUT -->
    <div id="checkout-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden flex justify-center items-end sm:items-center z-50">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                <div>
                    <h3 class="font-black text-slate-900 text-lg">Pembayaran</h3>
                    <p class="text-xs text-slate-500 font-medium">Selesaikan pesanan Anda</p>
                </div>
                <button onclick="closeCheckoutModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-slate-600 font-bold"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-4 text-xs font-medium">
                <div>
                    <label class="font-bold text-slate-700 block mb-1.5">Nama Pemesan</label>
                    <input type="text" id="pemesan-nama" placeholder="Masukkan nama Anda" class="w-full border-2 border-gray-200 bg-gray-50 p-3 rounded-xl text-sm focus:border-rose-500 outline-none transition" required>
                </div>
                <input type="hidden" id="pemesan-meja">
                
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200">
                    <p class="font-bold text-slate-700 mb-2">Daftar Pesanan:</p>
                    <div id="checkout-item-list" class="space-y-2 mb-3"></div>
                    <div class="flex justify-between font-black text-sm pt-3 border-t border-gray-200 text-slate-900">
                        <span>Total Tagihan:</span>
                        <span id="checkout-total-text" class="text-rose-600 text-lg">Rp 0</span>
                    </div>
                </div>

                <div class="bg-rose-50 p-4 rounded-xl border border-rose-100 text-center">
                    <p class="font-black text-rose-700 mb-2">Scan QRIS Untuk Bayar</p>
                    <div class="bg-white p-3 inline-block rounded-xl shadow-sm border border-gray-200 mb-2">
                        <!-- Kotak Dummy QRIS -->
                        <div class="w-32 h-32 bg-slate-900 rounded-lg flex flex-col items-center justify-center text-white">
                            <i class="fa-solid fa-qrcode text-5xl text-rose-500"></i>
                            <span class="text-[10px] font-bold mt-2 tracking-widest">QRIS KEDAI</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="font-bold text-slate-700 block mb-1.5">Upload Bukti Transfer (Wajib)</label>
                    <input type="file" id="bukti-transfer" accept="image/*" class="w-full border-2 border-gray-200 bg-gray-50 p-2.5 rounded-xl text-xs" required>
                </div>

                <button onclick="kirimPesanan()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-black py-4 rounded-xl shadow-lg shadow-rose-600/30 transition text-sm">
                    Bayar & Kirim Pesanan
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI SUPABASE ---
        const SUPABASE_URL = 'https://fvhtsirscdelesaninjg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2aHRzaXJzY2RlbGVzYW5pbmpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3ODMzNTksImV4cCI6MjEwOTM1OTM1OX0.0xFLkRGr9i4vRfxHM1SOjCbAlKo7ifukUdpUUlbxMC0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let menus = [];
        let cart = {}; 
        let orders = [];
        let currentMeja = 'Pilih Meja / Kasir';

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const mejaParam = urlParams.get('meja');
            if (mejaParam) currentMeja = `Meja ${mejaParam}`;
            
            document.getElementById('display-meja').innerText = currentMeja;
            document.getElementById('pemesan-meja').value = currentMeja;

            await fetchMenus();
            await fetchOrders();
            setupRealtimeSubscription();
        }

        // --- SISTEM TAMPILAN ---
        function switchView(view) {
            if(view === 'customer') {
                document.getElementById('view-customer').classList.remove('hidden');
                document.getElementById('kategori-bar').classList.remove('hidden');
                document.getElementById('view-admin').classList.add('hidden');
            } else {
                document.getElementById('view-customer').classList.add('hidden');
                document.getElementById('kategori-bar').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
                document.getElementById('cart-bar').classList.add('hidden');
                renderAdminOrders();
            }
        }

        function switchAdminTab(tab) {
            document.getElementById('tab-orders').className = "px-4 py-2 text-xs rounded-lg font-bold text-slate-500 hover:text-slate-900 transition whitespace-nowrap";
            document.getElementById('tab-menus').className = "px-4 py-2 text-xs rounded-lg font-bold text-slate-500 hover:text-slate-900 transition whitespace-nowrap";
            document.getElementById('tab-qr').className = "px-4 py-2 text-xs rounded-lg font-bold text-slate-500 hover:text-slate-900 transition whitespace-nowrap";
            
            document.getElementById('admin-orders-section').classList.add('hidden');
            document.getElementById('admin-menus-section').classList.add('hidden');
            document.getElementById('admin-qr-section').classList.add('hidden');

            document.getElementById(`tab-${tab}`).className = "px-4 py-2 text-xs rounded-lg font-bold bg-slate-900 text-white transition whitespace-nowrap";
            document.getElementById(`admin-${tab}-section`).classList.remove('hidden');
        }

        // --- FETCH DATA ---
        async function fetchMenus() {
            let { data, error } = await supabaseClient.from('menus').select('*');
            if (!error) {
                // Jika database kosong, kasih dummy Gacoan style
                menus = data && data.length > 0 ? data : [
                    { id: 1, name: 'Bakso Jumbo Pedas', price: 15000, img: 'https://images.unsplash.com/photo-1585032226651-759b368d7246?auto=format&fit=crop&w=300&q=80' },
                    { id: 2, name: 'Bakso Jumbo Manis', price: 14000, img: 'https://images.unsplash.com/photo-1626804475297-41609ea004eb?auto=format&fit=crop&w=300&q=80' }
                ];
                renderCustomerMenu();
                renderAdminMenus();
            }
        }

        async function fetchOrders() {
            let { data, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
            if (!error) {
                orders = data || [];
                renderAdminOrders();
            }
        }

        function setupRealtimeSubscription() {
            supabaseClient.channel('public:orders').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
                fetchOrders();
                playNotificationSound();
            }).subscribe();
        }

        // --- RENDER MENU ALA APLIKASI (KARTU GAMBAR BESAR) ---
        function renderCustomerMenu() {
            let html = '';
            menus.forEach(m => {
                let qty = cart[m.id] ? cart[m.id].qty : 0;
                let level = cart[m.id] ? cart[m.id].level : 'Level 0';
                
                // Placeholder gambar jika kosong
                let imgSrc = m.img || 'https://images.unsplash.com/photo-1585032226651-759b368d7246?auto=format&fit=crop&w=300&q=80';

                html += `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col relative">
                        <div class="h-32 w-full bg-gray-200">
                            <img src="${imgSrc}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-3 flex flex-col flex-grow justify-between">
                            <div>
                                <h3 class="font-black text-slate-800 text-[13px] leading-tight mb-1">${m.name}</h3>
                                <p class="font-bold text-rose-600 text-xs mb-2">Rp ${m.price.toLocaleString()}</p>
                            </div>
                            
                            <div class="space-y-2">
                                <!-- Pilihan Level Pedas -->
                                <select onchange="updateLevel(${m.id}, this.value)" class="w-full bg-gray-50 border border-gray-200 text-[10px] font-bold text-slate-600 p-1.5 rounded-lg outline-none">
                                    <option value="Level 0" ${level === 'Level 0' ? 'selected' : ''}>Ori / Tidak Pedas</option>
                                    <option value="Level 1" ${level === 'Level 1' ? 'selected' : ''}>🌶️ Level 1 (Sedang)</option>
                                    <option value="Level 2" ${level === 'Level 2' ? 'selected' : ''}>🌶️🌶️ Level 2 (Pedas)</option>
                                    <option value="Level 3" ${level === 'Level 3' ? 'selected' : ''}>🔥 Level 3 (Gila)</option>
                                </select>

                                <!-- Tombol Tambah / Kurang -->
                                ${qty === 0 ? `
                                    <button onclick="ubahQty(${m.id}, 1)" class="w-full bg-white border-2 border-rose-600 text-rose-600 font-bold py-1.5 rounded-xl text-xs hover:bg-rose-50 transition">
                                        Tambah
                                    </button>
                                ` : `
                                    <div class="flex justify-between items-center bg-gray-50 p-1 rounded-xl border border-gray-200">
                                        <button onclick="ubahQty(${m.id}, -1)" class="w-7 h-7 bg-white shadow-sm text-slate-700 rounded-lg font-bold">-</button>
                                        <span class="font-black text-sm">${qty}</span>
                                        <button onclick="ubahQty(${m.id}, 1)" class="w-7 h-7 bg-rose-600 text-white rounded-lg font-bold">+</button>
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('customer-menu-grid').innerHTML = html;
            updateCartBar();
        }

        function ubahQty(id, delta) {
            if(!cart[id]) cart[id] = { qty: 0, level: 'Level 0' };
            cart[id].qty += delta;
            if(cart[id].qty <= 0) delete cart[id];
            renderCustomerMenu();
        }

        function updateLevel(id, val) {
            if(!cart[id]) cart[id] = { qty: 1, level: val };
            else cart[id].level = val;
        }

        function updateCartBar() {
            let totalItems = 0;
            let totalPrice = 0;
            Object.keys(cart).forEach(id => {
                let m = menus.find(x => x.id == id);
                if (m) {
                    totalItems += cart[id].qty;
                    totalPrice += m.price * cart[id].qty;
                }
            });

            document.getElementById('cart-total-price').innerText = `Rp ${totalPrice.toLocaleString()}`;
            document.getElementById('cart-badge').innerText = totalItems;
            let cartBar = document.getElementById('cart-bar');
            if(totalItems > 0) cartBar.classList.remove('hidden');
            else cartBar.classList.add('hidden');
        }

        function openCheckoutModal() {
            if(currentMeja === 'Scan Meja Dulu' || currentMeja === 'Pilih Meja / Kasir') {
                alert('Silakan Scan QR Meja Anda terlebih dahulu!');
                return;
            }

            let totalPrice = 0;
            let html = '';
            Object.keys(cart).forEach(id => {
                let m = menus.find(x => x.id == id);
                if(m) {
                    let sub = m.price * cart[id].qty;
                    totalPrice += sub;
                    html += `
                        <div class="flex justify-between items-center text-xs font-bold border-b border-gray-100 pb-2">
                            <div>
                                <p class="text-slate-800">${cart[id].qty}x ${m.name}</p>
                                <p class="text-[10px] text-rose-500">${cart[id].level}</p>
                            </div>
                            <span class="text-slate-900">Rp ${sub.toLocaleString()}</span>
                        </div>
                    `;
                }
            });
            document.getElementById('checkout-item-list').innerHTML = html;
            document.getElementById('checkout-total-text').innerText = `Rp ${totalPrice.toLocaleString()}`;
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        async function kirimPesanan() {
            let nama = document.getElementById('pemesan-nama').value;
            let fileInput = document.getElementById('bukti-transfer').files[0];

            if(!nama || !fileInput) {
                alert('Nama dan Bukti Transfer wajib diisi!');
                return;
            }

            let items = [];
            let total = 0;
            Object.keys(cart).forEach(id => {
                let m = menus.find(x => x.id == id);
                if(m) {
                    items.push({ name: m.name, qty: cart[id].qty, note: cart[id].level });
                    total += m.price * cart[id].qty;
                }
            });

            let orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
            let buktiUrl = URL.createObjectURL(fileInput);

            let newOrder = {
                id: orderId,
                nama: nama,
                meja: currentMeja,
                items: items,
                total: total,
                status: 'Pending',
                bukti: buktiUrl
            };

            let { error } = await supabaseClient.from('orders').insert([newOrder]);
            if (!error) {
                cart = {};
                closeCheckoutModal();
                renderCustomerMenu();
                alert('Pesanan berhasil dibuat! Koki sedang menyiapkan bakso Anda.');
            } else {
                alert('Error: ' + error.message);
            }
        }

        // --- DASHBOARD ADMIN ---
        function renderAdminOrders() {
            let html = '';
            if(orders.length === 0) {
                html = `<div class="col-span-3 text-center py-10 font-bold text-gray-400 border-2 border-dashed border-gray-200 rounded-2xl">Dapur Kosong. Belum ada pesanan.</div>`;
            } else {
                orders.forEach(o => {
                    let badge = o.status === 'Pending' ? 'bg-rose-100 text-rose-700' : (o.status === 'Diproses' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700');
                    let itemsHtml = Array.isArray(o.items) ? o.items.map(i => `<p class="text-xs font-bold text-slate-700 border-b border-gray-100 pb-1 mb-1">${i.qty}x ${i.name} <span class="text-rose-500 float-right">${i.note}</span></p>`).join('') : '';
                    
                    html += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                            <div class="flex justify-between items-center mb-3">
                                <span class="font-black text-sm uppercase">${o.meja}</span>
                                <span class="text-[10px] px-2.5 py-1 rounded-full font-bold ${badge}">${o.status}</span>
                            </div>
                            <p class="text-xs font-bold text-slate-500 mb-2">Pemesan: <span class="text-slate-900">${o.nama}</span></p>
                            
                            <div class="bg-gray-50 p-3 rounded-xl mb-3">${itemsHtml}</div>
                            
                            <div class="flex items-center space-x-2 mb-4 bg-gray-50 p-2 rounded-xl">
                                <img src="${o.bukti || ''}" class="w-12 h-12 object-cover rounded-lg border cursor-pointer" onclick="window.open('${o.bukti}')">
                                <div>
                                    <p class="text-[10px] font-bold text-slate-500">Total QRIS</p>
                                    <p class="text-sm font-black text-rose-600">Rp ${(o.total || 0).toLocaleString()}</p>
                                </div>
                            </div>

                            <div class="flex space-x-2">
                                <button onclick="ubahStatusOrder('${o.id}', 'Diproses')" class="flex-1 bg-slate-900 text-white py-2 rounded-xl text-xs font-bold">Masak</button>
                                <button onclick="ubahStatusOrder('${o.id}', 'Selesai')" class="flex-1 bg-emerald-500 text-white py-2 rounded-xl text-xs font-bold">Selesai</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('admin-order-list').innerHTML = html;
        }

        async function ubahStatusOrder(id, status) {
            await supabaseClient.from('orders').update({ status: status }).eq('id', id);
            fetchOrders();
        }

        function renderAdminMenus() {
            let html = '';
            menus.forEach(m => {
                html += `
                    <div class="bg-white p-3 rounded-2xl border border-gray-200 shadow-sm flex items-center justify-between">
                        <div>
                            <p class="font-black text-xs">${m.name}</p>
                            <p class="text-xs text-rose-600 font-bold">Rp ${m.price.toLocaleString()}</p>
                        </div>
                        <button onclick="hapusMenu(${m.id})" class="text-red-500 bg-red-50 w-8 h-8 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
            document.getElementById('admin-menu-list').innerHTML = html;
        }

        async function tambahMenuBaru(e) {
            e.preventDefault();
            let nama = document.getElementById('menu-nama').value;
            let harga = parseInt(document.getElementById('menu-harga').value);
            let img = document.getElementById('menu-gambar').value || 'https://images.unsplash.com/photo-1585032226651-759b368d7246?auto=format&fit=crop&w=300&q=80';
            
            let { error } = await supabaseClient.from('menus').insert([{ name: nama, price: harga, status: 'Aktif', img: img }]);
            if (!error) {
                document.getElementById('form-add-menu').reset();
                fetchMenus();
            }
        }

        async function hapusMenu(id) {
            if(confirm('Hapus menu?')) {
                await supabaseClient.from('menus').delete().eq('id', id);
                fetchMenus();
            }
        }

        function buatQR() {
            let noMeja = document.getElementById('input-no-meja').value.trim();
            if(!noMeja) return alert('Isi nomor meja!');
            
            let finalUrl = window.location.origin + window.location.pathname + '?meja=' + encodeURIComponent(noMeja);
            document.getElementById('qr-result-container').classList.remove('hidden');
            document.getElementById('qr-result-container').classList.add('flex');
            document.getElementById('qr-meja-title').innerText = 'MEJA ' + noMeja;
            
            let qrBox = document.getElementById('qrcode-box');
            qrBox.innerHTML = '';
            new QRCode(qrBox, { text: finalUrl, width: 220, height: 220, colorDark : "#e11d48", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H });
        }

        function playNotificationSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 800; osc.type = 'sine';
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.start(); osc.stop(ctx.currentTime + 0.2);
        }
    </script>
</body>
</html>
