<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakso Bakar Jumbo - Self Order & POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { darkbg: '#121212', cardbg: '#1e1e1e' } }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media print {
            body * { visibility: hidden; }
            #qr-result-container, #qr-result-container * { visibility: visible; }
            #qr-result-container { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); width: 300px; border: none !important; background: transparent !important; }
            #btn-print-qr { display: none !important; }
        }
    </style>
</head>
<body class="bg-darkbg text-gray-200 font-sans antialiased min-h-screen">

    <!-- ================= 1. VIEW PELANGGAN (TETAP TEMA GACOAN GELAP) ================= -->
    <div id="view-customer" class="hidden pb-28">
        <header class="bg-cardbg border-b border-gray-800 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-rose-600 text-white flex items-center justify-center font-bold text-xl shadow-lg shadow-rose-600/20">B</div>
                    <div>
                        <h1 class="font-black text-white text-base tracking-wide uppercase">Bakso Bakar Jumbo</h1>
                        <div class="flex items-center text-xs font-bold text-rose-500 bg-rose-500/10 px-2.5 py-1 rounded-full w-fit mt-1 border border-rose-500/20">
                            <i class="fa-solid fa-location-dot mr-1.5"></i> <span id="display-meja">Scan QR Meja</span>
                        </div>
                    </div>
                </div>
                <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1">
                    <button class="px-4 py-2 bg-rose-600 text-white text-xs font-bold rounded-full whitespace-nowrap shadow-md">🔥 Bakso Bakar</button>
                    <button class="px-4 py-2 bg-gray-800 text-gray-400 text-xs font-bold rounded-full whitespace-nowrap border border-gray-700">🥤 Minuman</button>
                    <button class="px-4 py-2 bg-gray-800 text-gray-400 text-xs font-bold rounded-full whitespace-nowrap border border-gray-700">🍟 Extra</button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            <div id="customer-menu-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-5">
                <!-- Render Menu Pelanggan -->
            </div>
        </main>

        <div id="cart-bar" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-8 sm:w-96 bg-cardbg border border-gray-700 p-4 rounded-2xl shadow-2xl hidden flex justify-between items-center z-40">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-rose-600 rounded-full flex items-center justify-center relative">
                    <i class="fa-solid fa-bag-shopping text-white text-lg"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-white text-rose-600 text-[11px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-cardbg">0</span>
                </div>
                <div>
                    <p class="text-xs text-gray-400 font-medium">Total Pesanan</p>
                    <p class="font-black text-lg text-white" id="cart-total-price">Rp 0</p>
                </div>
            </div>
            <button onclick="openCheckoutModal()" class="bg-rose-600 hover:bg-rose-700 text-white px-5 py-3 rounded-xl font-bold text-sm shadow-md transition">Bayar <i class="fa-solid fa-chevron-right ml-1"></i></button>
        </div>
    </div>

    <!-- ================= 2. VIEW ADMIN (DASHBOARD BERSIH & RAPI) ================= -->
    <div id="view-admin" class="hidden min-h-screen bg-gray-50 text-gray-800 font-sans">
        
        <!-- Navbar Admin -->
        <nav class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded bg-rose-600 text-white flex items-center justify-center font-bold text-lg">B</div>
                    <span class="font-black text-gray-800 text-lg tracking-tight">Admin<span class="text-rose-600">Panel</span></span>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="flex items-center text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-md border border-emerald-100">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span> Live
                    </span>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6">
            
            <!-- Sidebar Menu Admin -->
            <aside class="w-full md:w-64 flex-shrink-0">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-3 space-y-1 sticky top-24">
                    <button onclick="switchAdminTab('orders')" id="tab-orders" class="w-full flex items-center space-x-3 px-4 py-3 text-sm font-bold rounded-lg bg-rose-50 text-rose-700 transition">
                        <i class="fa-solid fa-fire-burner w-5 text-center"></i> <span>Dapur & Pesanan</span>
                    </button>
                    <button onclick="switchAdminTab('menus')" id="tab-menus" class="w-full flex items-center space-x-3 px-4 py-3 text-sm font-bold rounded-lg text-gray-600 hover:bg-gray-50 transition">
                        <i class="fa-solid fa-utensils w-5 text-center"></i> <span>Kelola Menu</span>
                    </button>
                    <button onclick="switchAdminTab('qr')" id="tab-qr" class="w-full flex items-center space-x-3 px-4 py-3 text-sm font-bold rounded-lg text-gray-600 hover:bg-gray-50 transition">
                        <i class="fa-solid fa-qrcode w-5 text-center"></i> <span>Cetak QR Meja</span>
                    </button>
                </div>
            </aside>

            <!-- Konten Utama Admin -->
            <main class="flex-1">
                
                <!-- Kotak Metrik Ringkas -->
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-center">
                        <p class="text-xs text-gray-500 font-bold uppercase mb-1">Omzet Selesai</p>
                        <h3 class="text-xl font-black text-emerald-600" id="stat-omzet">Rp 0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-center">
                        <p class="text-xs text-gray-500 font-bold uppercase mb-1">Total Pesanan</p>
                        <h3 class="text-xl font-black text-gray-800" id="stat-total-order">0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-center">
                        <p class="text-xs text-gray-500 font-bold uppercase mb-1">Antrean Dapur</p>
                        <h3 class="text-xl font-black text-rose-600" id="stat-pending">0</h3>
                    </div>
                </div>

                <!-- Section: Dapur & Pesanan -->
                <div id="admin-orders-section">
                    <div class="flex items-center space-x-2 mb-4 bg-white p-2 rounded-lg border border-gray-200 shadow-sm w-fit">
                        <button onclick="filterOrder('Pending')" class="px-4 py-1.5 rounded text-xs font-bold bg-rose-100 text-rose-700">Masuk & Dimasak</button>
                        <button onclick="filterOrder('Selesai')" class="px-4 py-1.5 rounded text-xs font-bold text-gray-600 hover:bg-gray-100">Riwayat Selesai</button>
                        <button onclick="filterOrder('Semua')" class="px-4 py-1.5 rounded text-xs font-bold text-gray-600 hover:bg-gray-100">Semua Data</button>
                    </div>
                    <div id="admin-order-list" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
                </div>

                <!-- Section: Kelola Menu (Upload Gambar File) -->
                <div id="admin-menus-section" class="hidden space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <h3 class="font-bold text-gray-900 mb-4 border-b pb-2">Tambah Menu Baru</h3>
                        <form id="form-add-menu" onsubmit="tambahMenuBaru(event)" class="flex flex-col md:flex-row gap-6">
                            
                            <!-- Area Upload Gambar Local -->
                            <div class="w-full md:w-1/3">
                                <label class="block text-xs font-bold text-gray-600 mb-2">Foto Produk</label>
                                <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center hover:bg-gray-50 transition cursor-pointer relative overflow-hidden group h-40 flex flex-col items-center justify-center">
                                    <input type="file" id="menu-gambar-file" accept="image/*" onchange="previewMenuImage(this)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" required>
                                    <img id="preview-img" src="" class="absolute inset-0 w-full h-full object-cover hidden">
                                    <div id="upload-placeholder" class="text-gray-400 group-hover:text-rose-500 transition">
                                        <i class="fa-solid fa-cloud-arrow-up text-2xl mb-2"></i>
                                        <p class="text-xs font-bold">Pilih Foto dari Galeri</p>
                                    </div>
                                </div>
                                <input type="hidden" id="menu-gambar-b64"> <!-- Tempat simpan teks Base64 gambar -->
                            </div>

                            <!-- Area Input Detail -->
                            <div class="w-full md:w-2/3 space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">Nama Menu</label>
                                    <input type="text" id="menu-nama" placeholder="Contoh: Bakso Bakar Keju" required class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg text-sm outline-none focus:border-rose-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">Harga (Angka)</label>
                                    <input type="number" id="menu-harga" placeholder="Contoh: 15000" required class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg text-sm outline-none focus:border-rose-500">
                                </div>
                                <button type="submit" class="w-full bg-gray-900 text-white font-bold py-3 rounded-lg text-sm hover:bg-gray-800 transition shadow-sm mt-2">
                                    Simpan Menu ke Database
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Daftar Menu Saat Ini -->
                    <div id="admin-menu-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>

                <!-- Section: Generate QR -->
                <div id="admin-qr-section" class="hidden">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 max-w-sm">
                        <h3 class="font-black text-gray-900 mb-2 border-b pb-2">Buat QR Code Meja</h3>
                        <label class="block text-xs font-bold text-gray-600 mb-1 mt-3">Ketik Nomor Meja</label>
                        <div class="flex space-x-2 mb-4">
                            <input type="text" id="input-no-meja" placeholder="Cth: 01" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg text-center font-bold outline-none focus:border-rose-500">
                            <button onclick="buatQR()" class="bg-gray-900 text-white font-bold px-4 py-2.5 rounded-lg hover:bg-gray-800">Buat</button>
                        </div>
                        <div id="qr-result-container" class="hidden flex-col items-center border-2 border-dashed border-gray-200 p-4 rounded-xl bg-gray-50">
                            <h1 id="qr-meja-title" class="text-xl font-black mb-3 uppercase text-gray-900 tracking-widest">Meja --</h1>
                            <div id="qrcode-box" class="p-3 bg-white rounded-xl shadow-sm border border-gray-100 mb-4"></div>
                            <button id="btn-print-qr" onclick="window.print()" class="w-full bg-rose-600 text-white font-bold py-2 rounded-lg text-sm shadow-sm"><i class="fa-solid fa-print mr-2"></i>Cetak QR Ini</button>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- MODAL CHECKOUT PELANGGAN -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex justify-center items-end sm:items-center z-50">
        <div class="bg-cardbg w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-gray-800 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-5 border-b border-gray-800 pb-4">
                <div>
                    <h3 class="font-black text-white text-xl">Selesaikan Pembayaran</h3>
                    <p class="text-xs text-gray-400 font-medium">Pesanan dari <span id="modal-meja-text" class="text-rose-400 font-bold"></span></p>
                </div>
                <button onclick="closeCheckoutModal()" class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-4 text-sm font-medium">
                <div>
                    <label class="font-bold text-gray-300 block mb-1.5 text-xs">Nama Pemesan</label>
                    <input type="text" id="pemesan-nama" placeholder="Masukkan nama Anda" class="w-full bg-darkbg border border-gray-700 text-white p-3 rounded-xl outline-none" required>
                </div>
                
                <div class="bg-darkbg p-4 rounded-xl border border-gray-800">
                    <div id="checkout-item-list" class="space-y-2 mb-3"></div>
                    <div class="flex justify-between items-end pt-3 border-t border-gray-800">
                        <span class="text-gray-400 font-bold text-xs">Total Bayar</span>
                        <span id="checkout-total-text" class="text-rose-500 font-black text-xl">Rp 0</span>
                    </div>
                </div>

                <div class="bg-rose-900/20 p-4 rounded-xl border border-rose-900/50 text-center">
                    <p class="font-black text-rose-500 mb-2 text-xs uppercase tracking-widest">Scan QRIS Untuk Bayar</p>
                    <div class="bg-white p-2 inline-block rounded-xl shadow-xl">
                        <div class="w-28 h-28 bg-slate-900 rounded-lg flex flex-col items-center justify-center text-white">
                            <i class="fa-solid fa-qrcode text-4xl text-rose-500"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="font-bold text-gray-300 block mb-1.5 text-xs">Upload Bukti Transfer</label>
                    <input type="file" id="bukti-transfer" accept="image/*" class="w-full bg-darkbg border border-gray-700 text-gray-400 p-2 rounded-xl text-xs file:bg-gray-800 file:text-white file:border-0 file:px-3 file:py-1.5 file:rounded-lg file:mr-2" required>
                </div>

                <button onclick="kirimPesanan()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-black py-3.5 rounded-xl shadow-lg mt-2">
                    Kirim Pesanan
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT APLIKASI & SUPABASE -->
    <script>
        // --- KONFIGURASI SUPABASE ---
        const SUPABASE_URL = 'https://fvhtsirscdelesaninjg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2aHRzaXJzY2RlbGVzYW5pbmpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3ODMzNTksImV4cCI6MjEwOTM1OTM1OX0.0xFLkRGr9i4vRfxHM1SOjCbAlKo7ifukUdpUUlbxMC0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let menus = [];
        let cart = {}; 
        let orders = [];
        let currentMeja = 'Pilih Meja';
        let currentFilter = 'Pending'; // Tampilkan yang baru/dimasak secara default

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const mejaParam = urlParams.get('meja');

            if (mode === 'admin') {
                document.getElementById('view-admin').classList.remove('hidden');
                document.body.classList.remove('bg-darkbg');
                document.body.classList.add('bg-gray-50');
                await fetchMenus();
                await fetchOrders();
                setupRealtimeSubscription();
            } else {
                document.getElementById('view-customer').classList.remove('hidden');
                if (mejaParam) currentMeja = `Meja ${mejaParam}`;
                document.getElementById('display-meja').innerText = currentMeja;
                document.getElementById('modal-meja-text').innerText = currentMeja;
                await fetchMenus();
            }
        }

        function switchAdminTab(tab) {
            ['orders', 'menus', 'qr'].forEach(t => {
                document.getElementById(`tab-${t}`).className = "w-full flex items-center space-x-3 px-4 py-3 text-sm font-bold rounded-lg text-gray-600 hover:bg-gray-50 transition";
                document.getElementById(`admin-${t}-section`).classList.add('hidden');
            });
            document.getElementById(`tab-${tab}`).className = "w-full flex items-center space-x-3 px-4 py-3 text-sm font-bold rounded-lg bg-rose-50 text-rose-700 transition";
            document.getElementById(`admin-${tab}-section`).classList.remove('hidden');
        }

        async function fetchMenus() {
            let { data, error } = await supabaseClient.from('menus').select('*');
            if (!error) {
                menus = data || [];
                if(!document.getElementById('view-customer').classList.contains('hidden')) renderCustomerMenu();
                if(!document.getElementById('view-admin').classList.contains('hidden')) renderAdminMenus();
            }
        }

        async function fetchOrders() {
            let { data, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
            if (!error) {
                orders = data || [];
                renderAdminOrders();
                hitungStatistikAdmin();
            }
        }

        function setupRealtimeSubscription() {
            supabaseClient.channel('public:orders').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
                fetchOrders();
                if(payload.new.status === 'Pending') playNotificationSound(); // Bunyi hanya saat pesanan baru
            }).subscribe();
        }

        // --- PREVIEW & CONVERT FOTO UPLOAD (Base64) ---
        function previewMenuImage(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    // Tampilkan gambar di form
                    document.getElementById('preview-img').src = e.target.result;
                    document.getElementById('preview-img').classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                    // Simpan string Base64 ke input hidden untuk dikirim ke database
                    document.getElementById('menu-gambar-b64').value = e.target.result;
                }
                // Batasi ukuran gambar agar database tidak berat (Opsional tapi direkomendasikan jika file terlalu besar)
                if(input.files[0].size > 2000000) { 
                    alert("Peringatan: Ukuran foto terlalu besar. Proses simpan mungkin sedikit lebih lama.");
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- FUNGSI PELANGGAN ---
        function renderCustomerMenu() {
            let html = '';
            menus.forEach(m => {
                let qty = cart[m.id] ? cart[m.id].qty : 0;
                let level = cart[m.id] ? cart[m.id].level : 'Level 0';
                let imgSrc = m.img || 'https://images.unsplash.com/photo-1585032226651-759b368d7246?auto=format&fit=crop&w=300&q=80';

                html += `
                    <div class="bg-cardbg rounded-2xl overflow-hidden shadow-lg border border-gray-800 flex flex-col relative">
                        <div class="h-32 sm:h-40 w-full bg-gray-900">
                            <img src="${imgSrc}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-3 sm:p-4 flex flex-col flex-grow justify-between">
                            <div>
                                <h3 class="font-bold text-white text-sm leading-tight mb-1">${m.name}</h3>
                                <p class="font-black text-rose-500 text-sm mb-3">Rp ${m.price.toLocaleString()}</p>
                            </div>
                            <div class="space-y-2 mt-auto">
                                <select onchange="updateLevel(${m.id}, this.value)" class="w-full bg-darkbg border border-gray-700 text-xs font-bold text-gray-300 p-2 rounded-xl outline-none focus:border-rose-500">
                                    <option value="Tidak Pedas" ${level === 'Tidak Pedas' ? 'selected' : ''}>Ori / Tidak Pedas</option>
                                    <option value="Pedas Sedang" ${level === 'Pedas Sedang' ? 'selected' : ''}>🌶️ Pedas Sedang</option>
                                    <option value="Pedas Gila" ${level === 'Pedas Gila' ? 'selected' : ''}>🔥 Pedas Gila</option>
                                </select>
                                ${qty === 0 ? `
                                    <button onclick="ubahQty(${m.id}, 1)" class="w-full border-2 border-rose-600 text-rose-500 font-bold py-1.5 rounded-xl text-xs hover:bg-rose-600 hover:text-white transition">Tambah</button>
                                ` : `
                                    <div class="flex justify-between items-center bg-darkbg p-1 rounded-xl border border-gray-700">
                                        <button onclick="ubahQty(${m.id}, -1)" class="w-7 h-7 bg-gray-800 text-gray-300 rounded text-lg font-bold">-</button>
                                        <span class="font-black text-white text-sm">${qty}</span>
                                        <button onclick="ubahQty(${m.id}, 1)" class="w-7 h-7 bg-rose-600 text-white rounded font-bold">+</button>
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('customer-menu-grid').innerHTML = html;
            updateCartBar();
        }

        function ubahQty(id, delta) {
            if(!cart[id]) cart[id] = { qty: 0, level: 'Tidak Pedas' };
            cart[id].qty += delta;
            if(cart[id].qty <= 0) delete cart[id];
            renderCustomerMenu();
        }

        function updateLevel(id, val) {
            if(!cart[id]) cart[id] = { qty: 1, level: val };
            else cart[id].level = val;
        }

        function updateCartBar() {
            let totalItems = 0; let totalPrice = 0;
            Object.keys(cart).forEach(id => {
                let m = menus.find(x => x.id == id);
                if (m) { totalItems += cart[id].qty; totalPrice += m.price * cart[id].qty; }
            });
            document.getElementById('cart-total-price').innerText = `Rp ${totalPrice.toLocaleString()}`;
            document.getElementById('cart-badge').innerText = totalItems;
            if(totalItems > 0) document.getElementById('cart-bar').classList.remove('hidden');
            else document.getElementById('cart-bar').classList.add('hidden');
        }

        function openCheckoutModal() {
            if(currentMeja === 'Pilih Meja' || !currentMeja) return alert('Silakan Scan QR Meja Anda terlebih dahulu!');
            let totalPrice = 0; let html = '';
            Object.keys(cart).forEach(id => {
                let m = menus.find(x => x.id == id);
                if(m) {
                    let sub = m.price * cart[id].qty; totalPrice += sub;
                    html += `<div class="flex justify-between items-center text-xs font-bold border-b border-gray-800 pb-2">
                            <div><p class="text-gray-200">${cart[id].qty}x ${m.name}</p><p class="text-[10px] text-rose-500">${cart[id].level}</p></div>
                            <span class="text-white">Rp ${sub.toLocaleString()}</span></div>`;
                }
            });
            document.getElementById('checkout-item-list').innerHTML = html;
            document.getElementById('checkout-total-text').innerText = `Rp ${totalPrice.toLocaleString()}`;
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.add('hidden'); }

        async function kirimPesanan() {
            let nama = document.getElementById('pemesan-nama').value;
            let fileInput = document.getElementById('bukti-transfer').files[0];
            if(!nama || !fileInput) return alert('Nama dan Bukti Transfer wajib diisi!');

            // Ubah bukti transfer pelanggan ke Base64 agar tidak hilang
            let reader = new FileReader();
            reader.onloadend = async function() {
                let buktiB64 = reader.result;
                let items = [], total = 0;
                Object.keys(cart).forEach(id => {
                    let m = menus.find(x => x.id == id);
                    if(m) { items.push({ name: m.name, qty: cart[id].qty, note: cart[id].level }); total += m.price * cart[id].qty; }
                });

                let newOrder = {
                    id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                    nama: nama, meja: currentMeja, items: items, total: total, status: 'Pending', bukti: buktiB64
                };

                let { error } = await supabaseClient.from('orders').insert([newOrder]);
                if (!error) {
                    cart = {}; closeCheckoutModal(); renderCustomerMenu();
                    alert('Pesanan dikirim! Koki sedang menyiapkan.');
                } else alert('Error: ' + error.message);
            }
            reader.readAsDataURL(fileInput);
        }

        // --- FUNGSI ADMIN ---
        function filterOrder(status) {
            currentFilter = status;
            renderAdminOrders();
        }

        function renderAdminOrders() {
            let html = '';
            let filteredOrders = currentFilter === 'Semua' ? orders : 
                                 (currentFilter === 'Pending' ? orders.filter(o => o.status === 'Pending' || o.status === 'Diproses') : 
                                 orders.filter(o => o.status === currentFilter));

            if(filteredOrders.length === 0) {
                html = `<div class="col-span-full text-center py-10 font-bold text-gray-400 border-2 border-dashed border-gray-200 rounded-xl">Tidak ada pesanan.</div>`;
            } else {
                filteredOrders.forEach(o => {
                    let badge = o.status === 'Pending' ? 'bg-rose-100 text-rose-700' : (o.status === 'Diproses' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700');
                    let itemsHtml = Array.isArray(o.items) ? o.items.map(i => `<div class="flex justify-between text-xs font-bold text-gray-700 mb-1"><span>${i.qty}x ${i.name}</span> <span class="text-rose-500">${i.note}</span></div>`).join('') : '';
                    
                    html += `
                        <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-3">
                                    <span class="font-black text-sm uppercase text-gray-900">${o.meja}</span>
                                    <span class="text-[10px] px-2 py-0.5 rounded font-bold border border-current ${badge}">${o.status}</span>
                                </div>
                                <p class="text-xs font-bold text-gray-500 mb-3">Oleh: <span class="text-gray-900">${o.nama}</span></p>
                                <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 mb-4">${itemsHtml}</div>
                                <div class="flex items-center space-x-3 mb-4">
                                    <img src="${o.bukti || ''}" class="w-12 h-12 object-cover rounded bg-gray-100 border cursor-pointer" onclick="window.open('${o.bukti}')" title="Lihat Bukti Transfer">
                                    <div><p class="text-[10px] font-bold text-gray-400">Total QRIS</p><p class="text-sm font-black text-emerald-600">Rp ${(o.total || 0).toLocaleString()}</p></div>
                                </div>
                            </div>
                            <div class="flex space-x-2 pt-3 border-t border-gray-100">
                                ${o.status === 'Selesai' ? `<button class="w-full bg-emerald-50 text-emerald-600 py-2 rounded text-xs font-bold" disabled><i class="fa-solid fa-check mr-1"></i>Pesanan Selesai</button>` : `
                                <button onclick="ubahStatusOrder('${o.id}', 'Diproses')" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 rounded-lg text-xs font-bold transition">Proses Masak</button>
                                <button onclick="ubahStatusOrder('${o.id}', 'Selesai')" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded-lg text-xs font-bold transition">Selesai</button>`}
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('admin-order-list').innerHTML = html;
            // Update UI Filter Tabs active state
            const btnClasses = "px-4 py-1.5 rounded text-xs font-bold";
            const btns = document.querySelectorAll('#admin-orders-section button');
            btns[0].className = `${btnClasses} ${currentFilter === 'Pending' ? 'bg-rose-100 text-rose-700' : 'text-gray-600 hover:bg-gray-100'}`;
            btns[1].className = `${btnClasses} ${currentFilter === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : 'text-gray-600 hover:bg-gray-100'}`;
            btns[2].className = `${btnClasses} ${currentFilter === 'Semua' ? 'bg-gray-200 text-gray-800' : 'text-gray-600 hover:bg-gray-100'}`;
        }

        function hitungStatistikAdmin() {
            let totalOrder = orders.length;
            let pendingCount = orders.filter(x => x.status === 'Pending' || x.status === 'Diproses').length;
            let omzet = 0;
            orders.filter(x => x.status === 'Selesai').forEach(o => { omzet += (o.total || 0); });
            document.getElementById('stat-total-order').innerText = totalOrder;
            document.getElementById('stat-pending').innerText = pendingCount;
            document.getElementById('stat-omzet').innerText = `Rp ${omzet.toLocaleString()}`;
        }

        async function ubahStatusOrder(id, status) {
            await supabaseClient.from('orders').update({ status: status }).eq('id', id);
            fetchOrders();
        }

        function renderAdminMenus() {
            let html = '';
            menus.forEach(m => {
                let imgSrc = m.img || 'https://images.unsplash.com/photo-1585032226651-759b368d7246?auto=format&fit=crop&w=300&q=80';
                html += `
                    <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm flex items-center space-x-3">
                        <img src="${imgSrc}" class="w-12 h-12 rounded-lg object-cover bg-gray-100 border">
                        <div class="flex-grow">
                            <p class="font-bold text-xs text-gray-900">${m.name}</p>
                            <p class="text-xs text-emerald-600 font-black mt-0.5">Rp ${m.price.toLocaleString()}</p>
                        </div>
                        <button onclick="hapusMenu(${m.id})" class="text-red-500 hover:bg-red-50 w-8 h-8 rounded transition flex items-center justify-center"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
            document.getElementById('admin-menu-list').innerHTML = html;
        }

        async function tambahMenuBaru(e) {
            e.preventDefault();
            let nama = document.getElementById('menu-nama').value;
            let harga = parseInt(document.getElementById('menu-harga').value);
            // Ambil data Base64 dari input hidden yang terisi saat upload file lokal
            let imgBase64 = document.getElementById('menu-gambar-b64').value; 
            
            if(!imgBase64) {
                alert("Silakan pilih/upload foto menu terlebih dahulu!");
                return;
            }

            let { error } = await supabaseClient.from('menus').insert([{ name: nama, price: harga, status: 'Aktif', img: imgBase64 }]);
            if (!error) {
                document.getElementById('form-add-menu').reset();
                // Reset Image Preview
                document.getElementById('preview-img').src = '';
                document.getElementById('preview-img').classList.add('hidden');
                document.getElementById('upload-placeholder').classList.remove('hidden');
                document.getElementById('menu-gambar-b64').value = '';
                fetchMenus();
                alert('Menu berhasil disimpan ke database!');
            } else {
                alert('Error menyimpan menu: ' + error.message);
            }
        }

        async function hapusMenu(id) {
            if(confirm('Hapus menu ini secara permanen?')) {
                await supabaseClient.from('menus').delete().eq('id', id);
                fetchMenus();
            }
        }

        function buatQR() {
            let noMeja = document.getElementById('input-no-meja').value.trim();
            if(!noMeja) return alert('Isi nomor meja!');
            let finalUrl = window.location.origin + window.location.pathname + '?meja=' + encodeURIComponent(noMeja);
            document.getElementById('qr-result-container').classList.remove('hidden');
            document.getElementById('qr-result-container').classList.add('flex');
            document.getElementById('qr-meja-title').innerText = 'MEJA ' + noMeja;
            document.getElementById('qrcode-box').innerHTML = '';
            new QRCode(document.getElementById('qrcode-box'), { text: finalUrl, width: 200, height: 200, colorDark : "#1f2937", colorLight : "#ffffff" });
        }

        function playNotificationSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 800; osc.type = 'sine';
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.start(); osc.stop(ctx.currentTime + 0.2);
        }
    </script>
</body>
</html>
